name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cli:
    name: CLI binaries and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Test
        run: go test -count=1 ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    name: Publish @ternkit/tern to npm
    # Enabled by the repository variable NPM_PUBLISH=true; npm trusts this
    # workflow (Unfield/Tern, release.yml) as a trusted publisher.
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    needs: cli
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Set the package version from the tag
        working-directory: packages/tern
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version
          sed -i "s/export const VERSION = '.*';/export const VERSION = '$version';/" src/index.ts
          pnpm build
      - name: Publish
        working-directory: packages/tern
        # npm trusted publishing: the workflow's OIDC token authenticates,
        # so no npm token is stored in the repository.
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac
          npm publish --provenance --access public --tag "$tag"
