name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner routing is ci.yml's: the self-hosted runner only for pushes, when
# the repository variable SELF_HOSTED_RUNNER is "true". See
# infra/github-runner/README.md.

jobs:
  renders:
    name: Render benchmarks against the commit before
    runs-on: ${{ (vars.SELF_HOSTED_RUNNER == 'true' && github.event_name == 'push') && fromJSON('["self-hosted", "linux", "hetzner"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Compare
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then BASE=HEAD~1; fi
          ./benchmarks/compare.sh "$BASE"

  vs-sveltekit:
    name: Tern vs SvelteKit
    if: github.event_name == 'push'
    permissions:
      contents: read
      # To read the results of the last run on main, to compare.
      actions: read
    runs-on: ${{ vars.SELF_HOSTED_RUNNER == 'true' && fromJSON('["self-hosted", "linux", "hetzner"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm --filter @ternkit/tern build
      - name: Build both apps
        working-directory: benchmarks/vs-sveltekit
        run: |
          (cd tern && npm ci && npm run build)
          (cd sveltekit && npm ci && npm run build)
      - name: Run
        working-directory: benchmarks/vs-sveltekit
        env:
          DUR: 5s
          WARM: 2s
          WORKERS: 4
        run: ./run.sh
      - name: Record the binary size
        working-directory: benchmarks/vs-sveltekit
        run: |
          jq -nc --argjson b "$(stat -c %s tern/build/ternbench)" '{server: "tern", scenario: "binary", binary_bytes: $b}' >>results.jsonl
      - name: The last run on main
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/bench.yml/runs?branch=main&status=success&per_page=1" | jq -r '.workflow_runs[0].id // empty') || true
          echo "id=$id" >>"$GITHUB_OUTPUT"
      - name: Its results
        if: steps.previous.outputs.id != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: vs-sveltekit-results
          path: previous
          run-id: ${{ steps.previous.outputs.id }}
          github-token: ${{ github.token }}
      - name: Summary
        working-directory: benchmarks/vs-sveltekit
        run: ./summary.sh results.jsonl ../../previous/results.jsonl >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: vs-sveltekit-results
          path: benchmarks/vs-sveltekit/results.jsonl
          retention-days: 90
