name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner routing
#
# Linux jobs run on the self-hosted Hetzner runner only when ALL of these hold:
#   - the repository variable SELF_HOSTED_RUNNER is "true" (forks never have it)
#   - the event is a push, which only maintainers can trigger
# Pull requests always run on GitHub-hosted runners, because their code is
# untrusted. Do not change this without reading infra/github-runner/README.md.

jobs:
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    runs-on: ${{ (matrix.os == 'ubuntu-latest' && vars.SELF_HOSTED_RUNNER == 'true' && github.event_name == 'push') && fromJSON('["self-hosted", "linux", "hetzner"]') || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [oldstable, stable]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Verify go.mod is tidy
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...

  postgres:
    name: PostgreSQL and S3
    # Service containers need a GitHub-hosted runner.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tern
          POSTGRES_PASSWORD: tern
          POSTGRES_DB: tern
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tern"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Start an S3 server (SeaweedFS)
        run: |
          cat > /tmp/s3.json <<'JSON'
          {"identities":[{"name":"tern","credentials":[{"accessKey":"tern","secretKey":"tern-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/etc/s3.json chrislusf/seaweedfs server -s3 -s3.config=/etc/s3.json
          for i in $(seq 1 60); do
            curl -s -o /dev/null --aws-sigv4 "aws:amz:us-east-1:s3" --user tern:tern-secret-key -X PUT http://localhost:8333/tern && \
              curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user tern:tern-secret-key "http://localhost:8333/tern?list-type=2" >/dev/null && break
            sleep 2
          done
          curl -sf --aws-sigv4 "aws:amz:us-east-1:s3" --user tern:tern-secret-key "http://localhost:8333/tern?list-type=2"
      - name: Test the database and storage packages against PostgreSQL and S3
        env:
          TERN_TEST_POSTGRES: postgres://tern:tern@localhost:5432/tern?sslmode=disable
          TERN_TEST_S3: http://localhost:8333|us-east-1|tern|tern|tern-secret-key
        run: go test -race -count=1 -v ./migrate/ ./jobs/ ./sqldb/ ./plugins/oidc/ ./storage/ ./realtime/pgbroker/

  lint:
    name: Lint
    runs-on: ${{ (vars.SELF_HOSTED_RUNNER == 'true' && github.event_name == 'push') && fromJSON('["self-hosted", "linux", "hetzner"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  client:
    name: Client package and example types
    runs-on: ${{ (vars.SELF_HOSTED_RUNNER == 'true' && github.event_name == 'push') && fromJSON('["self-hosted", "linux", "hetzner"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: Client unit tests
        run: pnpm --filter @ternkit/tern test
      - name: Go and TypeScript message formatters agree
        run: go test -count=1 -run FuzzParity -v ./internal/i18n/
      - name: Server-render popular libraries and compare with Node
        run: |
          pnpm --filter ssr-compat build
          TERN_REQUIRE_COMPAT=1 go test -count=1 -run TestCompat -v ./internal/ssr/

  template:
    name: Starter template (${{ matrix.template }})
    strategy:
      fail-fast: false
      matrix:
        template: [minimal, blog, api]
    runs-on: ${{ (vars.SELF_HOSTED_RUNNER == 'true' && github.event_name == 'push') && fromJSON('["self-hosted", "linux", "hetzner"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: tern new, check, build and run
        run: scripts/test-template.sh ${{ matrix.template }}

  dev:
    name: tern dev integration
    runs-on: ${{ (vars.SELF_HOSTED_RUNNER == 'true' && github.event_name == 'push') && fromJSON('["self-hosted", "linux", "hetzner"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tern dev against examples/todos
        run: TERN_INTEGRATION=1 go test -count=1 -timeout 8m -run TestDevServer -v ./cmd/tern/

  e2e:
    name: End-to-end tests (${{ matrix.example }})
    # Browsers need system packages installed with sudo, so this job always
    # uses GitHub-hosted runners.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [todos, dashboard, status, goscript, ui]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: examples/${{ matrix.example }}
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: examples/${{ matrix.example }}
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.example }}
          path: examples/${{ matrix.example }}/test-results
          retention-days: 7
